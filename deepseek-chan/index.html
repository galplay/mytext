<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek 娘 · 2D 动态看板娘</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #dff0fb 0%, #b9ddf2 60%, #8fc7e8 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  h1{
    position:fixed;top:18px;left:0;right:0;text-align:center;
    font-size:18px;letter-spacing:4px;color:#31597f;opacity:.85;font-weight:600;
  }
  #stage{position:relative;touch-action:none;cursor:grab}
  #stage.dragging{cursor:grabbing}
  canvas{display:block;width:100%;height:100%}
  #bubble{
    position:absolute;left:50%;top:6%;transform:translate(-50%,-100%) scale(.6);
    background:#fff;color:#31597f;font-size:15px;padding:9px 16px;border-radius:18px;
    border:2px solid #7fb3d5;white-space:nowrap;opacity:0;pointer-events:none;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .25s;
    box-shadow:0 4px 14px rgba(49,89,127,.18);z-index:3;
  }
  #bubble::after{
    content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
    border:8px solid transparent;border-top-color:#fff;
  }
  #bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
  #panel{position:fixed;bottom:20px;display:flex;gap:10px;z-index:5}
  #panel button{
    border:2px solid #5b8db4;background:rgba(255,255,255,.85);color:#2f5d84;
    padding:8px 18px;border-radius:20px;font-size:14px;cursor:pointer;
    transition:transform .15s, background .15s;letter-spacing:2px;
  }
  #panel button:hover{transform:translateY(-2px);background:#fff}
  #panel button:active{transform:translateY(0) scale(.96)}
  #tip{position:fixed;bottom:64px;font-size:12px;color:#4a76a0;opacity:.75;letter-spacing:1px}
  .sea-bubble{
    position:fixed;bottom:-40px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,.15) 60%, rgba(255,255,255,0));
    border:1px solid rgba(255,255,255,.5);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0);opacity:0}
    10%{opacity:.8}
    100%{transform:translateY(-115vh) translateX(30px);opacity:0}
  }
</style>
</head>
<body>
<h1>DEEPSEEK 娘 · 看板娘</h1>

<div id="stage">
  <div id="bubble">你好呀~</div>
  <canvas id="view"></canvas>
</div>

<div id="tip">点她会开心 · 按住拖动可以拎起她 · 移动鼠标她会跟着倾斜</div>
<div id="panel">
  <button id="btn-talk">说话</button>
  <button id="btn-pet">摸摸头</button>
  <button id="btn-spin">转圈圈</button>
</div>

<script src="deepseek-chan-data.js"></script>
<script src="deepseek-chan-data2.js"></script>
<script>
/* ================= 画布 ================= */
const stage  = document.getElementById('stage');
const canvas = document.getElementById('view');
const ctx    = canvas.getContext('2d');
const bubble = document.getElementById('bubble');

let S = 0, DPR = 1;
function resize(){
  const w = Math.min(innerWidth * .8, innerHeight * .72, 480);
  S = Math.round(w);
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width = S * DPR; canvas.height = S * DPR;
  stage.style.width = S + 'px'; stage.style.height = S + 'px';
}
resize(); addEventListener('resize', resize);

/* ================= 绿幕抠图 + 轮廓包围盒 ================= */
function keyImage(src){
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = 1024;
      const cc = c.getContext('2d');
      cc.drawImage(im, 0, 0, 1024, 1024);
      const d = cc.getImageData(0, 0, 1024, 1024), p = d.data;
      let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
      for (let i = 0; i < p.length; i += 4) {
        const r = p[i], g = p[i+1], b = p[i+2];
        const key = g - Math.max(r, b);
        if (key > 40) { p[i+3] = 0; continue; }
        if (key > 5) {                       // 边缘羽化 + 去绿溢
          p[i+3] = Math.round(255 * (1 - (key - 5) / 35));
          p[i+1] = Math.max(r, b) + 6;
        }
        if (p[i+3] > 24) {                   // 统计不透明像素包围盒
          const px = (i / 4) % 1024, py = (i / 4) / 1024 | 0;
          if (px < x0) x0 = px; if (px > x1) x1 = px;
          if (py < y0) y0 = py; if (py > y1) y1 = py;
        }
      }
      cc.putImageData(d, 0, 0);
      resolve({ canvas: c, bbox: { x0, y0, x1, y1, cx: (x0+x1)/2, bottom: y1, h: y1-y0 } });
    };
    im.onerror = reject;
    im.src = src;
  });
}

let open = null, closed = null;      // 睁眼 / 闭眼 两张立绘
Promise.all([
  keyImage(typeof CHAR_DATA  !== 'undefined' ? CHAR_DATA  : 'deepseek-chan.png'),
  keyImage(typeof CHAR_DATA2 !== 'undefined' ? CHAR_DATA2 : 'deepseek-chan-closed.png')
]).then(([a, b]) => { open = a; closed = b; });

/* 闭眼图对齐：按包围盒把闭眼立绘缩放到与睁眼立绘同高、底边中心对齐 */
function drawSprite(g, sp){
  g.drawImage(sp.canvas, 0, 0);
}
function applyAlign(g){
  const ob = open.bbox, cb = closed.bbox;
  let s = ob.h / cb.h;
  s = Math.max(.85, Math.min(1.15, s));            // 防止离谱缩放
  g.translate(ob.cx, ob.bottom);
  g.scale(s, s);
  g.translate(-cb.cx, -cb.bottom);
}
function drawClosedAligned(g){
  g.save(); applyAlign(g); g.drawImage(closed.canvas, 0, 0); g.restore();
}

/* ---- 眨眼：只把闭眼图的眼部椭圆区域羽化贴到睁眼图上 ---- */
const EYE_PATCH = 170;                 // 取样窗口边长（立绘坐标）
const EYE_MASK_R = [58, 82];           // 羽化：实心半径 → 透明半径
const PATCH_ADJ  = { dx: 0, dy: 6 };   // 闭眼图眼部相对偏移微调
let patchBuf = null, maskBuf = null;
function ensurePatchBuffers(){
  if (patchBuf) return;
  patchBuf = document.createElement('canvas');
  patchBuf.width = patchBuf.height = EYE_PATCH;
  maskBuf = document.createElement('canvas');
  maskBuf.width = maskBuf.height = EYE_PATCH;
  const m = maskBuf.getContext('2d');
  const c = EYE_PATCH / 2;
  const gr = m.createRadialGradient(c, c, EYE_MASK_R[0], c, c, EYE_MASK_R[1]);
  gr.addColorStop(0, 'rgba(0,0,0,1)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  m.fillStyle = gr;
  m.fillRect(0, 0, EYE_PATCH, EYE_PATCH);
}
function drawEyePatch(g, e){
  ensurePatchBuffers();
  const p = patchBuf.getContext('2d');
  p.setTransform(1, 0, 0, 1, 0, 0);
  p.clearRect(0, 0, EYE_PATCH, EYE_PATCH);
  p.save();
  p.translate(EYE_PATCH / 2 - e.x + PATCH_ADJ.dx, EYE_PATCH / 2 - e.y + PATCH_ADJ.dy);
  applyAlign(p);
  p.drawImage(closed.canvas, 0, 0);
  p.restore();
  p.globalCompositeOperation = 'destination-in';
  p.drawImage(maskBuf, 0, 0);
  p.globalCompositeOperation = 'source-over';
  g.drawImage(patchBuf, e.x - EYE_PATCH / 2, e.y - EYE_PATCH / 2);
}
const EYES = [{ x: 418, y: 383 }, { x: 583, y: 383 }];

/* ================= 状态 ================= */
const st = {
  mood: 'idle',            // idle | happy | surprise
  moodUntil: 0,
  blinkUntil: 0, nextBlink: 2000,
  tilt: 0, tiltTarget: 0,
  squash: 0,
  spinDeg: 0,
  dragging: false, dragX: 0, dragY: 0, dragTilt: 0
};

/* ================= 台词 ================= */
const LINES = {
  hi:    ['你好呀~ 我是 DeepSeek 娘！', '今天也要一起写代码吗？', '咕嘟咕嘟~（冒泡）', '深海信号接收中……🐋'],
  pet:   ['嘿嘿，头发会乱掉的啦~', '再摸一下也不是不行……', '咿——（开心到喷水）', '摸头可以，不许拽呆毛！'],
  talk:  ['为什么鲸鱼不会迷路？因为自带 DeepSeek 导航！', 'bug 不是 bug，是未文档化的特性~', '我的尾巴是装饰……才怪，是真的！', '听说 AI 的尽头是算力，我的尽头是小鱼干。'],
  drag:  ['哇哇哇——！放我下来！', '要甩干我吗？！', '飞起来了！！（并没有）'],
  spin:  ['转完这一圈，bug 就会消失……大概。', '晕晕的，尾巴打结了啦！']
};
const pick = a => a[Math.floor(Math.random() * a.length)];
let bubbleTimer = null;
function say(t, ms = 2600){
  bubble.textContent = t;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
}
function setMood(m, ms){ st.mood = m; st.moodUntil = performance.now() + ms; }

/* ================= 交互 ================= */
addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  st.tiltTarget = ((e.clientX - r.left) / r.width - .5) * .10;
});

let downX = -1, downY = -1;
stage.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY;
  try { stage.setPointerCapture(e.pointerId); } catch(_){}
});
stage.addEventListener('pointermove', e => {
  if (e.buttons === 0 || downX < 0) return;
  const dx = e.clientX - downX, dy = e.clientY - downY;
  if (!st.dragging && Math.hypot(dx, dy) > 12) {
    st.dragging = true;
    stage.classList.add('dragging');
    setMood('surprise', 600000);
    say(pick(LINES.drag), 600000);
  }
  if (st.dragging) {
    st.dragX = dx; st.dragY = dy;
    st.dragTilt = Math.max(-.22, Math.min(.22, dx * .0016));
  }
});
addEventListener('pointerup', e => {
  if (downX < 0) return;
  downX = downY = -1;
  if (st.dragging) {
    st.dragging = false;
    stage.classList.remove('dragging');
    st.dragX = st.dragY = 0; st.dragTilt = 0;
    setMood('happy', 2000);
    st.squash = 1;
    say('呼……安全着陆。');
  } else if (e.target === canvas || stage.contains(e.target)) {
    setMood('happy', 2200);
    st.squash = 1;
    say(pick(LINES.pet.concat(LINES.hi)));
  }
});

document.getElementById('btn-talk').addEventListener('click', e => {
  e.stopPropagation();
  say(pick(LINES.talk), 3600);                       // 说话：只出气泡
});
document.getElementById('btn-pet').addEventListener('click', e => {
  e.stopPropagation();
  setMood('happy', 3000); st.squash = 1;
  say(pick(LINES.pet));
});
document.getElementById('btn-spin').addEventListener('click', e => {
  e.stopPropagation();
  setMood('happy', 3400);
  say(pick(LINES.spin), 3200);
  const t0 = performance.now();
  (function spin(){
    const p = Math.min(1, (performance.now() - t0) / 1200);
    st.spinDeg = 360 * (1 - Math.pow(1 - p, 3));
    if (p < 1) requestAnimationFrame(spin); else st.spinDeg = 0;
  })();
});

/* ================= 主循环 ================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(50, now - last); last = now;
  requestAnimationFrame(frame);
  if (!open || !closed) return;

  /* 眨眼调度 */
  if (now > st.nextBlink) {
    st.blinkUntil = now + 150;
    st.nextBlink = now + 1800 + Math.random() * 3200;
  }
  if (now > st.moodUntil && st.mood !== 'idle' && !st.dragging) st.mood = 'idle';

  /* 缓动 */
  st.tilt += (st.tiltTarget - st.tilt) * .06;
  if (st.squash > 0) st.squash = Math.max(0, st.squash - dt / 500);

  const sway   = Math.sin(now / 1100) * .012;
  const brth   = Math.sin(now / 620);
  const sq     = st.squash;
  const bounce = sq > 0 ? Math.sin(sq * Math.PI * 3) * sq : 0;

  const k = S / 1024 * DPR;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* 地面阴影 */
  ctx.fillStyle = 'rgba(60,100,140,.18)';
  ctx.beginPath();
  ctx.ellipse(canvas.width / 2, canvas.height - 10 * DPR,
              240 * k * (1 - bounce * .25), 22 * k, 0, 0, 7);
  ctx.fill();

  /* 角色变换：以脚底中心为支点 */
  ctx.save();
  ctx.translate(canvas.width / 2 + st.dragX * DPR, canvas.height + (st.dragY - bounce * 60) * DPR);
  ctx.rotate(st.tilt + sway + st.dragTilt + st.spinDeg * Math.PI / 180);
  ctx.scale(k * (1 + bounce * .06 + brth * .004), k * (1 - bounce * .08 - brth * .006));
  ctx.translate(-512, -1024);

  /* 开心 → 整图切换闭眼立绘；眨眼 → 睁眼立绘 + 只贴眼部 */
  const blink = now < st.blinkUntil;
  if (st.mood === 'happy') {
    drawClosedAligned(ctx);
  } else {
    drawSprite(ctx, open);
    if (blink) { drawEyePatch(ctx, EYES[0]); drawEyePatch(ctx, EYES[1]); }
  }

  ctx.restore();
}
requestAnimationFrame(frame);

/* 待机冒泡 */
setInterval(() => {
  if (Math.random() < .35 && !bubble.classList.contains('show') && !st.dragging)
    say(pick(LINES.hi), 2400);
}, 12000);

/* 背景气泡 */
for (let i = 0; i < 14; i++) {
  const b = document.createElement('div');
  b.className = 'sea-bubble';
  const s = 6 + Math.random() * 26;
  b.style.width = b.style.height = s + 'px';
  b.style.left = Math.random() * 100 + 'vw';
  b.style.animationDuration = 7 + Math.random() * 10 + 's';
  b.style.animationDelay = -Math.random() * 12 + 's';
  document.body.appendChild(b);
}
</script>
</body>
</html>
